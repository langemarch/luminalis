server.port=${PORT:8080}

# === Veritabani ===
# Varsayilan: H2 gomulu veritabani (hickimse bir sey kurmadan tek komutla calisir).
# MySQL kullanmak isterseniz DB_URL / DB_USER / DB_PASS ortam degiskenlerini tanimlayin,
# ornek DB_URL: jdbc:mysql://localhost:3306/luminalis?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/luminalis;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 konsolu (opsiyonel, tarayicidan /h2-console ile erisim)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf & Dosya Yukleme (Kahve Fali Fincan Fotografi)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Guvenlik Anahtari
luminalis.jwt.secret=${JWT_SECRET:LuminalisSuperGizliJwtAnahtari2026EnAz32Bayt!}
luminalis.jwt.expiration-ms=604800000
luminalis.ai.base-url=http://localhost:8001
